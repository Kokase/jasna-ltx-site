name = "jasna-ltx-site"
compatibility_date = "2026-11-20"
main = "dist/worker/index.js"

[build]
command = "npm run build"
watch_dir = "functions"

[assets]
directory = "dist/client"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[kv_namespaces]]
binding = "LTX_KV"
id = "50b9707dde5a42c89a2f8d0f25d3584b"
