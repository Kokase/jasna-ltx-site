name: 自动更新 Jasna-LTX 数据
on:
  workflow_dispatch:
    inputs:
      overwrite_existing:
        description: Update existing records with non-empty collected fields
        type: boolean
        default: true
      mode:
        description: 'Sync scope'
        type: choice
        default: all
        options:
          - all
          - import

permissions:
  contents: write

concurrency:
  group: ltx-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge supplied JSON
        run: |
          python -m unittest discover -s tests -p 'test_import_json.py'
          python scripts/import_json.py imports/sync-source.json --fill-empty-only --apply --report work/imports/sync-import-report.json

      - name: 抓取 JavDB 最新作品
        if: inputs.mode != 'import'
        env:
          OVERWRITE_EXISTING: ${{ inputs.overwrite_existing }}
        run: |
          python -m unittest discover -s tests -p 'test_sync_javdb.py'
          args=()
          if [ "$OVERWRITE_EXISTING" != "false" ]; then args+=(--overwrite-existing); fi
          python scripts/sync_javdb.py --max-add 20 "${args[@]}"

      - name: 运行同步脚本
        id: sync
        continue-on-error: true
        run: node scripts/sync.js
        env:
          NYAA_BASE: ${{ vars.NYAA_BASE || 'https://sukebei.nyaa.si' }}
          NYAA_QUERY: ${{ vars.NYAA_QUERY || 'LTX' }}
          MAX_ITEMS: '100'

      - name: 检查是否有变更
        id: verify
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "没有新作品"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到新作品"
          fi

      - name: 提交并推送
        if: steps.verify.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git commit -m "chore: 自动更新作品数据 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
