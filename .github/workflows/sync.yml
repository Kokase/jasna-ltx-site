name: 自动同步 Jasna-LTX 资源并部署

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: ltx-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 运行同步脚本
        id: sync
        continue-on-error: true
        run: node scripts/sync.js
        env:
          NYAA_BASE: ${{ vars.NYAA_BASE || 'https://sukebei.nyaa.si' }}
          NYAA_QUERY: ${{ vars.NYAA_QUERY || 'LTX' }}
          MAX_ITEMS: '100'

      - name: 检查是否有变更
        id: verify
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "没有新资源"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到数据变更"
          fi

      - name: 提交并推送更新
        if: steps.verify.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/movies.json
          git commit -m "chore: 自动同步 LTX 资源 $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]" || echo "无变更可提交"
          git push

      - name: 安装 Wrangler
        run: npm install wrangler@latest --no-audit --no-fund

      - name: 部署到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy . --project-name=jasna-ltx --branch=main --commit-dirty=true
